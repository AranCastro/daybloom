# Builds an installable Android APK of Daybloom on GitHub's machines and publishes it
# as a GitHub Release, so it can be downloaded straight onto a phone.
#
# Runs when app code changes on main (not for docs-only changes), or manually from the
# Actions tab ("Run workflow").
# Signing: when the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set, the APK is signed with that private key.
# Without them it keeps the Expo template's public debug key (test builds only; see README).
# Play Store builds come from `eas build --profile production`.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign with the Daybloom release key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -3
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="daybloom-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daybloom-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Daybloom ${{ steps.apk.outputs.version }} (test build ${{ github.run_number }})
          make_latest: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Installable test build of **Daybloom: Mood & Garden** for Android.

            1. Open this page on your Android phone and tap the `.apk` file below.
            2. When Android asks, allow installing apps from your browser.
            3. Open **Daybloom**.

            ${{ env.KEYSTORE_B64 != '' && 'Signed with the Daybloom release key.' || 'Test build signed with the public Expo debug key: for trying the app only.' }}
            Not the Play Store version. Built from commit ${{ github.sha }}.
