# Builds an installable Android APK of Daybloom on GitHub's machines and publishes it
# as a GitHub Release, so it can be downloaded straight onto a phone.
#
# Runs when app code changes on main (not for docs-only changes), or manually from the
# Actions tab ("Run workflow").
# Builds from main are published as the latest release; manual runs on other branches are
# published as previews (pre-releases, never marked latest).
# Signing: the APK has its own sideload key, separate from the Play upload key (Google re-signs
# Play installs with its own key, so one key for both would still clash). When the repository
# secrets SIDELOAD_KEYSTORE_BASE64, SIDELOAD_KEYSTORE_PASSWORD, SIDELOAD_KEY_ALIAS and
# SIDELOAD_KEY_PASSWORD are set, the APK is signed with that key; without them it keeps the
# Expo template's debug key. Play Store bundles come from play-bundle.yml.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      NODE_OPTIONS: --max-old-space-size=4096
      # Sync between phones (Google sign-in + the user's own Drive) is in the GitHub build only;
      # play-bundle.yml leaves it off.
      EXPO_PUBLIC_DEVICE_SYNC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # The key is only in this step's environment, not the job's, so no other action sees it.
      - name: Sign with the Daybloom sideload key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "signed=debug" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/signed.apk" | head -3
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "signed=sideload" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="daybloom-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daybloom-apk
          path: ${{ steps.apk.outputs.name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Daybloom ${{ steps.apk.outputs.version }}${{ github.ref != 'refs/heads/main' && ' preview' || '' }} (build ${{ github.run_number }})
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: ${{ steps.apk.outputs.name }}
          body: |
            **Daybloom: Mood & Garden** for Android.

            1. Open this page on your Android phone and tap the `.apk` file below.
            2. When Android asks, allow installing apps from your browser.
            3. Open **Daybloom**.

            ${{ steps.sign.outputs.signed == 'sideload' && 'Signed with the Daybloom sideload key.' || 'Signed with the Expo debug key.' }}
            This download and the Google Play version use different signing keys: to switch between them, back up first (Settings → Backup and restore), uninstall, install, then restore.
            Built from commit ${{ github.sha }}.
