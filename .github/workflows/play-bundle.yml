# Builds the Play Store version of Daybloom: an Android App Bundle (.aab) signed with the
# upload key, ready to upload in Play Console (Test and release → a track → Create new release).
#
# Run it by hand: Actions → "Build Play Store bundle" → Run workflow.
# Needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see docs/daybloom_play-release-guide_v1.md).
# Every upload to Play needs a higher versionCode: raise expo.android.versionCode in app.json,
# or type a number in the "versionCode" box when running the workflow.
name: Build Play Store bundle

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode override (leave empty to use app.json)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: 1
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check the upload key secrets
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (see docs/daybloom_play-release-guide_v1.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Set versionCode
        if: ${{ inputs.versionCode != '' }}
        env:
          CODE: ${{ inputs.versionCode }}
        run: |
          node -e "const f='app.json',fs=require('fs'),a=JSON.parse(fs.readFileSync(f));a.expo.android.versionCode=Number(process.env.CODE);fs.writeFileSync(f,JSON.stringify(a,null,2))"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign with the upload key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # Drop the debug signature Gradle added, then sign with the upload key.
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.MF' || true
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env KS_PASS -keypass:env KEY_PASS "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner|SHA256:' | head -2
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Name the bundle
        id: aab
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          NAME="daybloom-${VERSION}-vc${CODE}.aab"
          cp android/app/build/outputs/bundle/release/app-release.aab "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### $NAME ready: download it below under Artifacts and upload it in Play Console." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: daybloom-play-bundle
          path: ${{ steps.aab.outputs.name }}
